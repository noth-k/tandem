AWSTemplateFormatVersion: "2010-09-09"
Description: IAM access policy for live-commerce hackathon members

Parameters:
  MemberGroupName:
    Type: String
    Description: IAM group to create and attach the hackathon member access policy to
    Default: openai-sea-hackathon-members

Resources:
  MemberGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Ref MemberGroupName

  HackathonMemberAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-member-access-policy"
      Description: Read/write access to the live-commerce hackathon stack resources
      Groups:
        - !Ref MemberGroup
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DynamoDBReadWrite
            Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ProductNames"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ProductNames/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Products"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Products/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Messages"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Messages/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Discounts"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Discounts/index/*"

          - Sid: SQSReadWrite
            Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:PurgeQueue
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource:
              - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:chat-queue"
              - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:product-details-queue"

          - Sid: LambdaReadWriteInvoke
            Effect: Allow
            Action:
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionUrlConfig
              - lambda:InvokeFunction
              - lambda:InvokeFunctionUrl
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:responder-agent-lambda"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:product-update-lambda"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:post-debrief-lambda"

          - Sid: CloudWatchLogsList
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: "*"

          - Sid: CloudWatchLambdaLogsRead
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/responder-agent-lambda:*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/product-update-lambda:*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/post-debrief-lambda:*"

          - Sid: ConsoleListAndStackRead
            Effect: Allow
            Action:
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStacks
              - dynamodb:ListTables
              - lambda:ListFunctions
              - sqs:ListQueues
            Resource: "*"

Outputs:
  MemberGroupName:
    Value: !Ref MemberGroup

  HackathonMemberAccessPolicyArn:
    Value: !Ref HackathonMemberAccessPolicy
